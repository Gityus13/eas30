<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EAS30 - Gallery</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X9XKJHVREF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-X9XKJHVREF');
    </script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="https://files.catbox.moe/icnd8l.png"
    >

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- AOS -->
    <link
        href="https://unpkg.com/aos@2.3.1/dist/aos.css"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;

            background: linear-gradient(45deg, #050b18, #0b1f3a, #123a6b, #0e5a7a, #0f766e, #0b3b55, #0a1a33, #0f2a4a);

            overflow-x: hidden;

            animation: gradientShift 30s ease infinite;

            background-size: 400% 400%;

            transition: all 0.5s ease;

            min-height: 100vh;

            display: flex;

            flex-direction: column;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* DARK MODE */

        body.dark-mode {
            background: #0f172a !important;

            animation: none !important;

            color: #e2e8f0;
        }

        body.dark-mode header {
            background: rgba(15, 23, 42, 0.8) !important;
        }

        body.dark-mode footer {
            background: rgba(15, 23, 42, 0.9) !important;
        }

        body.dark-mode .gallery-card {
            background: linear-gradient(
                135deg,
                #1e293b,
                #334155
            ) !important;

            color: #e2e8f0;

            border: 1px solid #475569;
        }

        /* Floating logo */

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* Dark mode button */

        .dark-mode-toggle {
            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 1000;
        }

        .toggle-button {
            background: rgba(255, 255, 255, 0.2);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 50%;

            width: 50px;

            height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .toggle-button:hover {
            background: rgba(255, 255, 255, 0.3);

            transform: translateY(-2px);
        }

        .toggle-button i {
            font-size: 20px;

            color: white;
        }

        /* Gallery */

        .gallery-container {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 2rem;

            padding: 2rem 1rem;

            max-width: 1200px;

            width: 100%;

            margin: 0 auto;

            flex: 1;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(10px);

            border-radius: 24px;

            padding: 1.5rem;

            width: 100%;

            max-width: 350px;

            transition: all 0.4s cubic-bezier(
                0.175,
                0.885,
                0.32,
                1.275
            );

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gallery-card:hover {
            transform: translateY(-15px);

            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .gallery-image {
            width: 100%;

            height: 250px;

            object-fit: cover;

            border-radius: 16px;

            margin-bottom: 1rem;

            border: 3px solid rgba(255, 255, 255, 0.3);

            transition: all 0.3s ease;
        }

        .gallery-card:hover .gallery-image {
            transform: scale(1.02);

            border-color: rgba(255, 255, 255, 0.8);
        }

        .gallery-caption {
            font-family: 'Fraunces', serif;

            font-size: 1.25rem;

            color: white;

            text-align: center;

            font-weight: 500;

            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Header */

        header {
            background: rgba(0, 0, 0, 0.15);

            backdrop-filter: blur(5px);

            padding: 2rem 1rem;
        }

        .logo {
            width: 80px;

            height: 80px;

            border-radius: 50%;

            margin: 0 auto 1rem;

            object-fit: cover;
        }

        h1 {
            font-family: 'Fraunces', serif;

            font-size: 3rem;

            color: white;

            text-align: center;

            margin-bottom: 0.5rem;
        }

        /* Footer */

        footer {
            background: rgba(0, 0, 0, 0.2);

            backdrop-filter: blur(5px);

            padding: 1.5rem;

            text-align: center;

            color: rgba(255, 255, 255, 0.9);

            font-size: 0.9rem;

            margin-top: auto;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .gallery-container {
                gap: 1.5rem;
            }

            .gallery-card {
                max-width: 300px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .gallery-card {
                max-width: 280px;
            }

            .gallery-image {
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <!-- Dark Mode Toggle -->

    <div class="dark-mode-toggle">

        <button
            class="toggle-button"
            id="darkModeToggle"
            type="button"
            aria-label="Toggle dark mode"
        >

            <i class="fas fa-moon"></i>

        </button>

    </div>


    <!-- Header -->

    <header>

        <div class="container mx-auto px-4 text-center">

            <img
                src="https://files.catbox.moe/icnd8l.png"
                alt="EAS30 Logo"
                class="logo floating"
            >

            <h1>EAS30 HOSTS GALLERY</h1>

        </div>

    </header>


    <!-- Gallery -->

    <main class="gallery-container">

        <!-- Yusif -->

        <div
            class="gallery-card"
            data-aos="fade-up"
            data-aos-delay="100"
        >

            <img
                src="https://files.catbox.moe/zyt1jf.jpeg"
                alt="Yusif Gurbanzade"
                class="gallery-image"
                onerror="this.src='https://via.placeholder.com/350x250?text=Image+1'"
            >

            <div class="gallery-caption">
                Yusif Gurbanzade
            </div>

        </div>


        <!-- Kenan -->

        <div
            class="gallery-card"
            data-aos="fade-up"
            data-aos-delay="300"
        >

            <img
                src="https://files.catbox.moe/j078pt.jpg"
                alt="Kenan Mikayilzade"
                class="gallery-image"
                onerror="this.src='https://via.placeholder.com/350x250?text=Image+2'"
            >

            <div class="gallery-caption">
                Kenan Mikayilzade
            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <div class="container mx-auto px-4">

            <p class="text-base md:text-xl">

                <span class="text-2xl md:text-3xl">©</span>

                2026 EAS30. If you find incorrect information or would like to suggest a change, please contact us.

                Made by YUSAI and Kenanchik. Logo by Safia.B.

            </p>

        </div>

    </footer>


    <script>

        // Initialize animations

        AOS.init({
            duration: 1000,
            once: true,
            easing: 'ease-out-cubic',
            offset: 100
        });


        // Dark mode

        const darkModeToggle =
            document.getElementById('darkModeToggle');

        const toggleIcon =
            darkModeToggle.querySelector('i');

        const body =
            document.body;


        // Load saved theme

        const currentTheme =
            localStorage.getItem('theme');


        if (currentTheme === 'dark') {

            body.classList.add('dark-mode');

            toggleIcon.classList.remove('fa-moon');

            toggleIcon.classList.add('fa-sun');

        }


        // Toggle theme

        darkModeToggle.addEventListener('click', () => {

            body.classList.toggle('dark-mode');


            if (body.classList.contains('dark-mode')) {

                toggleIcon.classList.remove('fa-moon');

                toggleIcon.classList.add('fa-sun');

                localStorage.setItem('theme', 'dark');

            } else {

                toggleIcon.classList.remove('fa-sun');

                toggleIcon.classList.add('fa-moon');

                localStorage.setItem('theme', 'light');

            }

        });

    </script>

</body>
</html>
