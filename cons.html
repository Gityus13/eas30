<body>

    <div class="cursor-dot"></div>

    <div class="noise"></div>

    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>

    <main class="page">

        <section class="hero" id="hero">

<div class="brand-mark reveal reveal-1">
    <div class="brand-symbol">

    <div class="brand-caption">

<p class="subtitle reveal reveal-4 cursor-react-subtitle">

<h1 class="reveal reveal-3 cursor-react-text">

    <span class="react-word gold-word">new</span>

    <span class="react-word">coming.</span>

            <p class="subtitle reveal reveal-4">

            <div class="countdown reveal reveal-5">

                    <div class="number-wrap">

                </div>

                <div class="separator"></div>

                <div class="time-card">
                    <div class="number-wrap">

                <div class="separator"></div>

                <div class="time-card">
                    <div class="number-wrap">

                    </div>

                </div>

                <div class="time-card">
                    <div class="number-wrap">

                </div>

            <div class="status reveal reveal-6">

<a

>
