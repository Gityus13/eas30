<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - EAS30</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(45deg, #050b18, #0b1f3a, #123a6b, #0e5a7a, #0f766e, #0b3b55, #0a1a33, #0f2a4a);
            background-size: 400% 400%;
            animation: auroraFlow 18s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0a0f1f, #0b1120, #111827, #1e1b2f) !important;
            animation: none;
        }

        @keyframes auroraFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: rgba(22, 28, 46, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 2rem 1.8rem 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        body.dark-mode .login-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: white;
            padding: 6px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .brand {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFF6E5, #FFD966, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            color: white;
            font-weight: 600;
            font-size: 1.8rem;
            margin: 0.5rem 0 0.3rem;
        }

        .welcome-text {
            color: #cdd9ff;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-align: left;
            border-left: 3px solid #f4a261;
            padding-left: 12px;
        }

        /* ---------- sign-in buttons ---------- */

        .provider-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .google-slot {
            display: flex;
            justify-content: center;
            min-height: 44px;
        }

        .telegram-slot {
            display: flex;
            justify-content: center;
            min-height: 40px;
        }

        .provider-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            border: 1px solid transparent;
            border-radius: 40px;
            padding: 13px 0;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .provider-btn i {
            font-size: 1.25rem;
        }

        .provider-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .provider-btn.discord {
            background: #5865f2;
            color: #fff;
        }
        .provider-btn.discord:hover {
            background: #4752c4;
        }

        .provider-btn.github {
            background: #24292f;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.18);
        }
        .provider-btn.github:hover {
            background: #32383f;
        }

        .provider-btn.microsoft {
            background: #fff;
            color: #3c4043;
            border-color: #dadce0;
        }
        .provider-btn.microsoft:hover {
            background: #f8f9fa;
        }

        .ms-logo {
            display: grid;
            grid-template-columns: repeat(2, 9px);
            grid-template-rows: repeat(2, 9px);
            gap: 2px;
        }
        .ms-logo i {
            display: block;
            width: 9px;
            height: 9px;
        }
        .ms-logo i:nth-child(1) { background: #f25022; }
        .ms-logo i:nth-child(2) { background: #7fba00; }
        .ms-logo i:nth-child(3) { background: #00a4ef; }
        .ms-logo i:nth-child(4) { background: #ffb900; }

        .provider-btn:focus-visible,
        .guest-link:focus-visible {
            outline: 3px solid #ffb347;
            outline-offset: 3px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 20px;
            color: rgba(255,255,240,0.5);
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        .guest-link {
            background: none;
            border: none;
            color: #ffb347;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 16px;
        }

        .guest-link:hover {
            text-decoration: underline;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .toggle-button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .toggle-button i {
            font-size: 1.3rem;
            color: white;
        }

        .error-message {
            background: #ff4757;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            display: none;
        }

        .dev-hint {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #cdd9ff;
            font-size: 0.8rem;
            line-height: 1.4;
            text-align: left;
        }

        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
            .provider-btn { transition: none; }
            .provider-btn:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div class="dark-mode-toggle">
        <div class="toggle-button" id="darkModeToggle">
            <i class="fas fa-moon"></i>
        </div>
    </div>

    <div class="login-card">
        <div class="logo-area">
            <img src="logo.png" alt="EAS30 logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand">EAS30</div>
        </div>
        <h2>Welcome back</h2>
        <div class="welcome-text">
            Sign in to access the full gallery, games & community.
        </div>

        <div id="errorMsg" class="error-message" role="alert"></div>

        <div class="provider-list">
            <div id="googleLoginBtn" class="google-slot"></div>

            <!-- These stay hidden until the server says the provider is set up -->
            <a id="btn-discord" class="provider-btn discord" href="/api/auth/discord/start" hidden>
                <i class="fa-brands fa-discord" aria-hidden="true"></i>
                <span>Continue with Discord</span>
            </a>

            <a id="btn-github" class="provider-btn github" href="/api/auth/github/start" hidden>
                <i class="fa-brands fa-github" aria-hidden="true"></i>
                <span>Continue with GitHub</span>
            </a>

            <a id="btn-microsoft" class="provider-btn microsoft" href="/api/auth/microsoft/start" hidden>
                <span class="ms-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span>Continue with Microsoft</span>
            </a>

            <div id="telegramSlot" class="telegram-slot" hidden></div>
        </div>

        <p id="devHint" class="dev-hint" hidden></p>

        <div class="divider">
            <div class="divider-line"></div>
            <span>or</span>
            <div class="divider-line"></div>
        </div>

        <button id="guestBtn" class="guest-link">Continue as guest →</button>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = "695398839217-ql189kgqbelkpb1taavqdgoers63uuh0.apps.googleusercontent.com";
        const AUTH_ORIGIN = "https://auth.eas30.site";
        const STORAGE_KEY = "eas_hobbies_user";

        const ERRORS = {
            cancelled: "Sign-in was cancelled.",
            state: "That sign-in link expired. Please try again.",
            exchange: "Couldn't finish signing in with that provider. Please try again.",
            unconfigured: "That sign-in method isn't available yet.",
            telegram: "Telegram couldn't be verified. Please try again.",
            google: "Google sign-in couldn't be verified. Please try again.",
            generic: "Something went wrong. Please try again."
        };

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 6000);
        }

        // Save the user for the rest of the site, then go to the home page.
        function finishLogin(user) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
            sendWelcomeOnce(user);
            window.location.href = "index.html";
        }

        // One welcome email per account per browser. The server only ever emails
        // the verified address on the session, never an address sent by the page.
        function sendWelcomeOnce(user) {
            if (!user.email || !user.id || user.provider === "guest") return;
            const key = "eas_welcomed_" + user.id;
            if (localStorage.getItem(key)) return;
            localStorage.setItem(key, "1");
            fetch(AUTH_ORIGIN + "/api/login-email", { method: "POST", credentials: "include", keepalive: true }).catch(() => {});
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch(e) {
                console.error("Failed to parse JWT", e);
                return null;
            }
        }

        /* ---------- Google ---------- */

        async function onGoogleCredential(response) {
            try {
                const res = await fetch(AUTH_ORIGIN + "/api/auth/google", {
                    credentials: "include",
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ credential: response.credential })
                });
                if (res.ok) {
                    const data = await res.json();
                    finishLogin(data.user);
                    return;
                }
                if (res.status !== 404) {
                    showError(ERRORS.google);
                    return;
                }
                // 404 = no server functions here (plain static hosting). Fall through to the old local login.
            } catch (e) {
                showError(ERRORS.generic);
                return;
            }

            const p = parseJwt(response.credential);
            if (p) {
                finishLogin({
                    id: "google:" + p.sub,
                    name: p.name,
                    email: p.email,
                    picture: p.picture,
                    provider: "google"
                });
            } else {
                showError(ERRORS.google);
            }
        }

        function initGoogleSignIn() {
            const script = document.createElement('script');
            script.src = 'https://accounts.google.com/gsi/client';
            script.onload = () => {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: onGoogleCredential,
                    cancel_on_tap_outside: true
                });

                const card = document.querySelector('.login-card');
                const width = Math.max(200, Math.min(400, card.clientWidth - 60));

                google.accounts.id.renderButton(
                    document.getElementById('googleLoginBtn'),
                    {
                        type: "standard",
                        theme: "outline",
                        size: "large",
                        text: "continue_with",
                        shape: "pill",
                        locale: "en",
                        width: width
                    }
                );
            };
            script.onerror = () => {
                showError("Failed to load Google Sign-In. Please refresh the page.");
            };
            document.head.appendChild(script);
        }

        /* ---------- Discord / GitHub / Microsoft / Telegram ---------- */

        function mountTelegram(botUsername) {
            const slot = document.getElementById('telegramSlot');
            const s = document.createElement('script');
            s.async = true;
            s.src = "https://telegram.org/js/telegram-widget.js?22";
            s.setAttribute("data-telegram-login", botUsername);
            s.setAttribute("data-size", "large");
            s.setAttribute("data-radius", "20");
            s.setAttribute("data-userpic", "false");
            s.setAttribute("data-auth-url", AUTH_ORIGIN + "/api/auth/telegram/callback");
            slot.hidden = false;
            slot.appendChild(s);
        }

        // Only shown when you open the site on your own computer (localhost).
        function devHint(message) {
            if (!["localhost", "127.0.0.1"].includes(location.hostname)) return;
            const el = document.getElementById("devHint");
            el.textContent = message;
            el.hidden = false;
        }

        async function loadProviders() {
            const NO_SERVER = "Dev note: only Google and guest work on a plain static server. " +
                "To test Discord, GitHub, Microsoft and Telegram, run: npx wrangler pages dev . --port 8788 " +
                "and open http://localhost:8788 (see AUTH_SETUP.md).";
            try {
                const res = await fetch(AUTH_ORIGIN + "/api/auth/providers", { cache: "no-store", credentials: "include" });
                if (!res.ok) {
                    devHint(NO_SERVER);
                    return;
                }
                const cfg = await res.json();
                let shown = 0;
                ["discord", "github", "microsoft"].forEach((name) => {
                    if (cfg[name]) {
                        document.getElementById("btn-" + name).hidden = false;
                        shown++;
                    }
                });
                if (cfg.telegram) {
                    mountTelegram(cfg.telegram);
                    shown++;
                }
                if (!shown) {
                    devHint(cfg.sessions
                        ? "Dev note: no providers are set up yet. Add their keys to .dev.vars and restart."
                        : "Dev note: SESSION_SECRET is missing. Copy .dev.vars.example to .dev.vars, fill it in and restart.");
                }
            } catch (e) {
                devHint(NO_SERVER);
            }
        }

        /* ---------- Guest ---------- */

        function guestLogin() {
            const guestName = "Guest_" + Math.floor(Math.random() * 10000);
            finishLogin({
                id: "guest:" + guestName,
                name: guestName,
                email: null,
                picture: "https://ui-avatars.com/api/?background=6c5ce7&color=fff&name=" + guestName.charAt(0),
                provider: "guest"
            });
        }

        document.getElementById('guestBtn').addEventListener('click', guestLogin);

        /* ---------- Start ---------- */

        (async function start() {
            const params = new URLSearchParams(location.search);

            if (params.has("error") || params.has("auth")) {
                history.replaceState(null, "", location.pathname);
            }

            if (params.get("error")) {
                showError(ERRORS[params.get("error")] || ERRORS.generic);
            }

            // Back from Discord / GitHub / Microsoft / Telegram: load the verified user.
            if (params.get("auth") === "ok") {
                try {
                    const res = await fetch(AUTH_ORIGIN + "/api/auth/me", { cache: "no-store", credentials: "include" });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.user) {
                            finishLogin(data.user);
                            return;
                        }
                    }
                } catch (e) { /* handled below */ }
                showError(ERRORS.generic);
            }

            // Already logged in? Go home.
            if (localStorage.getItem(STORAGE_KEY)) {
                window.location.href = "index.html";
                return;
            }

            document.getElementById("btn-discord").href = AUTH_ORIGIN + "/api/auth/discord/start";
            document.getElementById("btn-github").href = AUTH_ORIGIN + "/api/auth/github/start";
            document.getElementById("btn-microsoft").href = AUTH_ORIGIN + "/api/auth/microsoft/start";
            initGoogleSignIn();
            loadProviders();
        })();

        /* ---------- Dark mode toggle ---------- */

        const darkModeToggle = document.getElementById('darkModeToggle');
        const toggleIcon = darkModeToggle.querySelector('i');
        const body = document.body;

        if (localStorage.getItem('loginTheme') === 'dark') {
            body.classList.add('dark-mode');
            toggleIcon.classList.remove('fa-moon');
            toggleIcon.classList.add('fa-sun');
        }

        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                toggleIcon.classList.remove('fa-moon');
                toggleIcon.classList.add('fa-sun');
                localStorage.setItem('loginTheme', 'dark');
            } else {
                toggleIcon.classList.remove('fa-sun');
                toggleIcon.classList.add('fa-moon');
                localStorage.setItem('loginTheme', 'light');
            }
        });
    </script>
</body>
</html>
